<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities | LikeMinded+</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><span class="logo-icon">🧠</span> LikeMinded+</a>
    <div class="navbar-links">
      <a href="/">Dashboard</a>
      <a href="/register">Register</a>
      <a href="/matches">Matches</a>
      <a href="/communities-page" class="active">Communities</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Auto-Generated Communities</h1>
      <p>Discover AI-created communities based on shared domains and complementary roles</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="cluster-method">Clustering Method</label>
        <select id="cluster-method">
          <option value="rule">Rule-Based (by Domain)</option>
          <option value="dbscan">DBSCAN (Density)</option>
          <option value="kmeans">K-Means</option>
        </select>
      </div>
      <div class="control-group" id="vectorizer-group">
        <label for="vec-method">Vectorizer</label>
        <select id="vec-method">
          <option value="tfidf">TF-IDF</option>
          <option value="bert">BERT</option>
        </select>
      </div>
      <div class="control-group" id="k-group" style="display:none">
        <label for="k-value">Num Clusters (K)</label>
        <input type="number" id="k-value" value="5" min="2" max="20">
      </div>
      <div class="control-group" style="justify-content:flex-end">
        <button class="btn btn-primary" onclick="generateCommunities()">🏘️ Generate</button>
      </div>
    </div>

    <div id="communities-container">
      <div class="empty-state">
        <div class="empty-icon">🏘️</div>
        <p>Click "Generate" to create AI-powered communities</p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/communities.js"></script>
</body>
</html>
