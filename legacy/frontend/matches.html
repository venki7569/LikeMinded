<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Matches | LikeMinded+</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><span class="logo-icon">🧠</span> LikeMinded+</a>
    <div class="navbar-links">
      <a href="/">Dashboard</a>
      <a href="/register">Register</a>
      <a href="/matches" class="active">Matches</a>
      <a href="/communities-page">Communities</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Find Similar Users</h1>
      <p>Select a user and discover their closest matches using AI-powered similarity</p>
    </div>

    <div class="controls" id="match-controls">
      <div class="control-group">
        <label for="user-select">Select User</label>
        <select id="user-select"><option value="">Loading users...</option></select>
      </div>
      <div class="control-group">
        <label for="method-select">Vectorization</label>
        <select id="method-select">
          <option value="tfidf">TF-IDF</option>
          <option value="bert">BERT Embeddings</option>
        </select>
      </div>
      <div class="control-group">
        <label for="topn-select">Top N</label>
        <select id="topn-select">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="control-group" style="justify-content:flex-end">
        <button class="btn btn-primary" id="find-matches-btn" onclick="findMatches()">🔍 Find Matches</button>
      </div>
    </div>

    <div id="matches-container">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>Select a user and click "Find Matches" to discover similar profiles</p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/matches.js"></script>
</body>
</html>
